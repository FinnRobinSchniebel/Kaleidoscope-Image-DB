# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  backend:
    build:
      context: ./
      dockerfile: ./KaleidoscopeBackend/Dockerfile.backend
      target: final
      args:
        BACKEND_VOLUME_LOCATION: ${BACKEND_VOLUME_LOCATION}
    ports:
      - ${SERVERPORT}:${SERVERPORT}
    environment:
      SERVERPORT: ${SERVERPORT}
      BACKEND_VOLUME_LOCATION: ${BACKEND_VOLUME_LOCATION}
    secrets:
      - mongo_user
      - mongo_password
      - jwt_secret
      - password_pepper
    volumes:
      - Image_data:${BACKEND_VOLUME_LOCATION}
    depends_on:
      - db
  frontend:
    build:
      context: ./KaleidoscopeFrontend/
      dockerfile: ./Dockerfile.frontend
      target: final
    environment:
      BACKEND_URL: ${BACKEND_URL}
    ports: 
      - 3001:3000
    
    depends_on:
      - backend
    #stdin_open:true
    #tty:true

  db:
    image: mongo:latest
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
      MONGO_INITDB_DATABASE: KaleidoDB
    secrets:
      - mongo_user
      - mongo_password
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data:
  Image_data:

secrets:
  mongo_user:
    file: ./secrets/mongo_user.txt
  mongo_password:
    file: ./secrets/mongo_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  password_pepper:
    file: ./secrets/password_pepper.txt



